# electron-builder 配置
# 文档: https://www.electron.build/
#
# 构建命令（在 package.json scripts 中已配置）：
#   npm run electron:dist:mac            # 推荐：universal dmg（同时支持 Intel + Apple Silicon）
#   npm run electron:dist:mac:arm64     # 仅 Apple Silicon (M1/M2/M3...)
#   npm run electron:dist:mac:x64       # 仅 Intel Mac

appId: com.ideacode.app
productName: IDEACODE
copyright: Copyright © 2026 IDEACODE

# 构建产物输出目录
directories:
  output: release
  buildResources: build

# 需要打包进 ASAR 的文件白名单（其余文件如 src/、scripts/ 不进包）
files:
  - electron/**/*
  - dist/**/*
  - extensions/**/*
  - packages/**/*
  - package.json
  - "!**/.git/**"
  - "!**/*.map"
  # §禁止将开发环境的 lifeAiCode 大模型配置（含 API key）打包进安装包
  - "!extensions/**/.lifeAiCode-config.json"
  - "!**/node_modules/*/{README,readme,CHANGELOG,changelog}*"
  - "!**/node_modules/*/{test,tests,__tests__,docs,doc,examples}/**"

# ASAR 打包：渲染进程资源 + 主进程代码全部装入 app.asar
asar: true

# native 模块必须解包到 app.asar.unpacked，否则：
#   - .node 二进制无法被 dlopen
#   - spawn 子进程的 .mjs/.js 无法正确 require 依赖（typescript-language-server）
#   - rg 二进制无法被 spawn 执行（@vscode/ripgrep 的 bin/rg）
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/typescript-language-server/**
  # systeminformation 在 macOS 上调用 system_profiler/top，本身纯 JS，但部分平台需要 native binding
  - node_modules/systeminformation/**
  # §ripgrep 二进制：spawn 无法从 asar 内执行二进制，必须解包到 app.asar.unpacked
  - node_modules/@vscode/ripgrep/**

# ─── macOS 配置 ───
mac:
  category: public.app-category.developer-tools
  # 开发期关闭 hardenedRuntime，跳过签名步骤，避免无证书时的卡顿/报错。
  # 正式分发时改回 true 并配置苹果开发者证书。
  hardenedRuntime: false
  gatekeeperAssess: false
  # 未配置证书时显式不签名，避免 electron-builder 尝试签名失败
  identity: null
  # 扩展宿主子进程 + node-pty spawn-helper 需要的权限
  extendInfo:
    NSAppleEventsUsageDescription: IDEACODE 需要发送 Apple 事件以执行部分系统集成。
  # 目标产物：
  #   - dir: 只输出 .app 文件夹（快速调试用）
  #   - dmg: 创建 DMG 安装包（需要在非 Trae sandbox 环境运行：macOS Terminal.app 或配置 sandbox 放行 /dev/rdisk*）
  # arch 不在配置文件指定，由命令行 --arm64/--x64/--universal 控制，
  # 避免「命令行打 arm64 但配置文件强制 universal」导致重复下载 x64 二进制。
  target:
    - target: dir
    - target: dmg

# DMG 安装包布局（拖拽安装）
dmg:
  title: ${productName}-${version}
  # format 控制 DMG 文件系统压缩：
  #   UDRO = 只读不压缩（最快，包体最大）
  #   UDZO = zlib 压缩（默认，速度与体积均衡）
  #   UDBZ = bzip2 压缩（慢，体积更小）
  # 开发期用 UDRO 加速打包，正式分发改回 UDZO
  format: UDRO
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

# ─── Windows 配置 ───
win:
  # 目标产物：
  #   - nsis: 标准 .exe 安装程序（支持选择目录、创建快捷方式）
  #   - portable: 免安装便携版（单 .exe 文件，解压即用）
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 图标路径（buildResources 目录下，需提供 build/icon.ico）
  icon: build/icon.ico
  # 签名：开发期不签名，跳过 signtool 调用避免无证书时卡顿
  signAndEditExecutable: false

# Windows NSIS 安装程序配置
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: IDEACODE
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 安装界面语言，zh-CN 缺失时回退到英文
  installerLanguages:
    - zh_CN
    - en_US

# ─── Linux 配置 ───
linux:
  category: Development
  # 目标产物：
  #   - AppImage: 通用可执行镜像（免安装，chmod +x 后直接运行，跨发行版）
  #   - deb: Debian/Ubuntu 安装包（apt install ./xxx.deb）
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # 图标路径（buildResources 目录下，需提供 build/icon.png 512x512）
  icon: build/icon.png
  maintainer: IDEACODE
  vendor: IDEACODE

# AppImage 配置
appImage:
  # 开发期不嵌入 license 文件
  license: null

# deb 配置
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# ─── 打包压缩级别（根级别，控制 ASAR/app 压缩）───
# store=不压缩（最快，包体大 30%）、normal=默认、maximum=最慢
# 开发期用 store 加速打包，正式分发改回 normal
compression: store

# ─── native 模块重编译 ───
# 打包前自动按 Electron 版本/架构 rebuild node-pty 等 native 模块
# 默认开启，确保 universal 包内同时包含 x64 + arm64 native 二进制
npmRebuild: true

# 注意：前端资源（dist/）+ 扩展（extensions/）的构建由 npm script 链式调用：
#   npm run electron:dist:mac → npm run build && electron-builder ...
# 这里不配置 afterPack/beforeBuild 钩子，避免循环依赖。
